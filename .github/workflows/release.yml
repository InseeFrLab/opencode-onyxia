# Checks the config on every pull request; on a `v*` tag, also builds the release tarball and publishes it.
# Release assets (same names in every release, so .../releases/latest/download/<name> always works):
#   opencode-onyxia.tar.gz  opencode-onyxia.tar.gz.sha256  onyxia-init.sh
name: release

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install opencode v2
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          for d in "$HOME/.opencode/bin" "$HOME/.local/bin"; do echo "$d" >> "$GITHUB_PATH"; done
      - run: opencode --version
      - run: python3 -I scripts/check_permissions.py
      - run: python3 -I scripts/check_install.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build_dist.sh "$GITHUB_REF_NAME" dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/opencode-onyxia.tar.gz dist/opencode-onyxia.tar.gz.sha256 dist/onyxia-init.sh
